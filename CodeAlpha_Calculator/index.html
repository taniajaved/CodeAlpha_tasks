<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Calculator</title>
    <!-- Premium Fonts Setup -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body spellcheck="false" data-ms-editor="false">

    <div class="container">
        <!-- Professional Title Header Component -->
        <div class="calculator-app-title">
            <span class="title-meta">// COMPILING_SYSTEM_CORE</span>
            <h2>CodeAlpha Live Calculator</h2>
            <p>Integrated Matrix Computational Processing Engine</p>
        </div>

        <div class="calculator" spellcheck="false" data-ms-editor="false">
            <div class="calculator-header">
                <div class="window-dots">
                    <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                </div>
                <span class="console-title">calc_engine.sh</span>
            </div>

            <input type="text" id="display" placeholder="0" readonly spellcheck="false" data-ms-editor="false">

            <div class="buttons">
                <button class="operator" data-value="C">C</button>
                <button class="operator" data-value="backspace">⌫</button>
                <button class="operator" data-value="%">%</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button data-value="00">00</button>
                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equal" data-value="=">=</button>
            </div>
        </div>
    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
